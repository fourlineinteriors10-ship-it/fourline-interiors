    <text x="0" y="32" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="800" font-size="28" letter-spacing="3" fill="#FFFFFF">FOUR<tspan fill="#C89A55">LINE</tspan></text>
    <!-- INTERIORS -->
    <text x="2" y="49" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="700" font-size="10.5" letter-spacing="6.8" fill="#B5AEA5">INTERIORS</text>
  </g>
</svg>
